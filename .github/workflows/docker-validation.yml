name: Docker validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker compose build

      - name: Start services
        run: docker compose up --detach --wait --wait-timeout 120

      - name: Check API health
        run: curl --fail --retry 20 --retry-connrefused --retry-delay 3 http://localhost:5002/health

      - name: Check prediction endpoint
        run: |
          response="$(curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data '{"age":35,"distance_km":10,"physical_ability":5,"dose_rate_usv_h":0}' \
            http://localhost:5002/predict)"
          python -c "import json,sys; result=json.loads(sys.argv[1]); assert isinstance(result.get('demo_index'), (int, float)); assert 'not a survival probability' in result.get('notice', '')" "$response"

      - name: Check Streamlit UI
        run: curl --fail --retry 5 --retry-all-errors --retry-delay 2 http://localhost:8501/

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans
